<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄金V2.2｜财政数据</title><style>body{background:#0c1523;color:#edf4ff;font:16px system-ui;margin:0}main{max-width:920px;margin:auto;padding:28px}section{background:#17263a;border-radius:14px;padding:20px;margin:14px 0}h1{font-size:26px}.muted{color:#aebfd3}.value{font-size:30px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #34435a;text-align:left;padding:10px}button{padding:10px 16px;border:0;border-radius:8px;background:#4b8dff;color:white}a{color:#a6caff}</style></head><body><main><h1>黄金V2.2 · 美国财政数据</h1><p class="muted">财政部DTS官方接口 · 已验证的报告日数据 · 非交易信号</p><button onclick="load()">刷新</button><section><p id="status">正在加载…</p><p class="muted">TGA最新期末余额（十亿美元）</p><div class="value" id="balance">—</div><p id="date"></p><p id="delta"></p></section><section><h2>最近报告记录</h2><table><thead><tr><th>报告日期</th><th>TGA余额（十亿美元）</th></tr></thead><tbody id="rows"></tbody></table></section><section><h2>模型状态</h2><p>已部署：官方DTS服务端读取、TGA期末余额筛选、历史报告展示、债务交易接口诊断。</p><p class="muted">未完成：历史数据库、D+1/3/5预测、TreasuryDirect结算拆分、每小时定时采集、黄金K线及A/A+/A++交易信号。缺失数据不会被填成估计值。</p><p>原始接口：<a href="/api/treasury">/api/treasury</a></p></section></main><script>
function el(id){return document.getElementById(id)}function usd(x){let n=Number(x);return Number.isFinite(n)?(n/1000).toFixed(3):'—'}
async function load(){el('status').textContent='读取财政部数据中…';try{const r=await fetch('/api/treasury',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error((d.errors||[]).join('; ')||d.error||'HTTP '+r.status);let h=d.history||[];if(!h.length)throw Error('没有符合条件的TGA期末余额');el('balance').textContent=usd(h[0].close_today_bal);el('date').textContent='报告日期：'+h[0].record_date;el('delta').textContent=h[1]?'较上一报告日：'+((Number(h[0].close_today_bal)-Number(h[1].close_today_bal))/1000).toFixed(3)+' 十亿美元':'上一报告日不可用';el('rows').innerHTML=h.slice(0,15).map(x=>'<tr><td>'+x.record_date+'</td><td>'+usd(x.close_today_bal)+'</td></tr>').join('');el('status').textContent='读取成功 · '+new Date(d.retrieved_at).toLocaleString('zh-CN');}catch(e){el('status').textContent='读取失败：'+e.message;el('balance').textContent='—';}}
load();</script></body></html>
