name: Audit gold 5min intraday and V2.2 4h entry refinement
on:
  workflow_dispatch:
  push:
    paths:
      - lib/endpoints/v22-gold-5m-intraday-core.js
      - lib/endpoints/v22-gold-5m-refine-core.js
      - tests/v22-gold-5m-intraday-core.test.js
      - tests/v22-gold-5m-refine-core.test.js
      - scripts/v22-gold-5m-two-tracks.js
      - .github/workflows/v22-gold-5m-two-tracks.yml
permissions:
  contents: write
concurrency:
  group: gold-real-five-minute-strategy-research
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify 5m no-future, NY session and next-open stop-first engine
        run: |
          node --check scripts/v22-gold-5m-two-tracks.js
          node --check lib/endpoints/v22-gold-5m-intraday-core.js
          node --check lib/endpoints/v22-gold-5m-refine-core.js
          node tests/v22-gold-5m-intraday-core.test.js
          node tests/v22-gold-5m-refine-core.test.js
          node tests/v22-price-pattern-core.test.js
          node tests/v22-dow-proxy-core.test.js
      - name: Fetch actual quoted GC 5m and 1h, test BOTH separately
        run: node scripts/v22-gold-5m-two-tracks.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-five-minute-two-strategy-research-report
          path: reports/v22-gold-5m-two-tracks-latest.json
          retention-days: 21
      - name: Fail if no direct minute history or falsely claim original V2.2 improvement
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('reports/v22-gold-5m-two-tracks-latest.json'))
          assert x['status']=='gold_5m_two_tracks_tested_research_only',x.get('error')
          assert x['trade_signals_enabled'] is False
          assert x['original_full_v22_trade_results_claimed'] is False
          assert x['data_source']['five_minute_history']['clean']>4000
          assert x['data_source']['five_minute_history']['distinct_eligible_US_NY_morning_dates']>25
          intraday=x['track_2_independent_gold_five_minute_trading']
          assert len(intraday['results_full_observed_window'])==4
          for s in intraday['results_full_observed_window'].values():
              assert isinstance(s['return_pct'],(float,int))
              assert s['max_drawdown_pct']>=0
          ref=x['track_1_existing_V22_four_hour_to_five_minute_execution']['samples_10bp']
          assert ref['status']=='gold_4h_breakout_with_actual_5m_counterfactual_research'
          assert ref['strict_B_entry_refinement']['four_hour_anchor_events_with_actual_5m_cover']>=0
          PY
      - name: Archive reproducible real 5m research result
        run: |
          cp reports/v22-gold-5m-two-tracks-latest.json /tmp/v22-5m-two-tracks.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reports
            cp /tmp/v22-5m-two-tracks.json reports/v22-gold-5m-two-tracks-latest.json
            git add reports/v22-gold-5m-two-tracks-latest.json
            git commit -m 'Record direct 5min gold 4h entry-refinement and intraday cost stress findings' || exit 0
            git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
