name: Validate production API
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
  push:
    branches: [main]
concurrency:
  group: production-validation-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository for saving reports
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Wait for Vercel production deployment
        run: sleep 90
      - name: Check production routes and record JSON
        shell: bash
        run: |
          mkdir -p diagnostics
          failed=0
          for name in treasury forecast horizon-backtest historical-coverage full-history-backtest source-coverage readiness gold-source-audit v22-source-audit v22-cot-audit v22-ohlc-integrity v22-spec gold-proxy-backtest; do
            echo "Checking $name"
            status=$(curl -L -sS --retry 3 --retry-delay 5 --max-time 110 -w '%{http_code}' -o "diagnostics/$name.json" "https://gold-v22-real-data-v1.vercel.app/api/$name") || status=000
            echo "$name HTTP $status"
            if [ "$status" != "200" ]; then
              failed=1
              echo "::warning::$name HTTP $status"
            fi
            python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); print("status:",x.get("status"),"error:",x.get("error"),"observations:",x.get("observations"))' "diagnostics/$name.json" || failed=1
          done
          for year in $(seq 2023 $(date -u +%Y)); do
            echo "Checking TGA year $year"
            status=$(curl -L -sS --retry 2 --retry-delay 2 --max-time 50 -w '%{http_code}' -o "diagnostics/tga-$year.json" "https://gold-v22-real-data-v1.vercel.app/api/full-history-backtest?year=$year") || status=000
            echo "TGA $year HTTP $status"
            if [ "$status" != "200" ]; then failed=1; echo "::warning::TGA $year HTTP $status"; fi
            python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("status"),x.get("error"),x.get("observations"))' "diagnostics/tga-$year.json" || failed=1
          done
          echo "Some checks failed: $failed"
          exit "$failed"
      - name: Save diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-api-diagnostics
          path: diagnostics/
          retention-days: 14
      - name: Publish machine-readable latest verification
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,glob,datetime,os
          records={}
          for path in glob.glob('diagnostics/*.json'):
              name=os.path.basename(path).removesuffix('.json')
              try:
                  with open(path) as f: payload=json.load(f)
                  records[name]={'status':payload.get('status'),'error':payload.get('error'),'observations':payload.get('observations'),'first_date':payload.get('first_date'),'last_date':payload.get('last_date'),'data':payload if name in ('full-history-backtest','readiness','v22-source-audit','v22-cot-audit','v22-ohlc-integrity','v22-spec','gold-proxy-backtest') else None}
              except Exception as e: records[name]={'error':str(e)}
          if not records:
              raise SystemExit('Refusing to overwrite previous production report with empty diagnostics')
          os.makedirs('reports',exist_ok=True)
          with open('reports/production-latest.json','w') as f: json.dump({'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'commit':os.environ.get('GITHUB_SHA'),'endpoints':records},f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp reports/production-latest.json /tmp/new-production-latest.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/new-production-latest.json reports/production-latest.json
            git add reports/production-latest.json
            git commit -m "Record latest production API verification" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::Could not publish production verification after retries"
          exit 1
