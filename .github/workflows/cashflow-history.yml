name: Validate multi-year Treasury cashflow identity
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/v22-cashflow-history.js
      - lib/endpoints/v22-cashflow-core.js
      - lib/endpoints/v22-fiscal-composite-core.js
      - lib/endpoints/v22-fiscal-expectation-core.js
      - tests/v22-fiscal-expectation-core.test.js
      - lib/endpoints/v22-tax-calendar.js
      - lib/endpoints/v22-fiscal-price-core.js
      - lib/endpoints/v22-fiscal-revision-core.js
      - tests/v22-fiscal-revision-core.test.js
      - tests/v22-fiscal-price-core.test.js
      - tests/v22-tax-calendar.test.js
      - tests/v22-fiscal-composite-core.test.js
      - .github/workflows/cashflow-history.yml
concurrency:
  group: v22-complete-dts-cashflow-history
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate parsers and duplicate-guard tests
        run: |
          node --check scripts/v22-cashflow-history.js
          node tests/v22-cashflow-core.test.js
          node tests/v22-fiscal-composite-core.test.js
          node tests/v22-fiscal-expectation-core.test.js
          node tests/v22-tax-calendar.test.js
          node tests/v22-fiscal-price-core.test.js
          node tests/v22-fiscal-revision-core.test.js
      - name: Build audited 2023-present daily Treasury nondebt, tax and financing cashflows
        run: node scripts/v22-cashflow-history.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-tga-cashflow-history-audit
          path: reports/fiscal-cashflow-history-latest.json
          retention-days: 14
      - name: Publish only aggregated Treasury research metrics
        if: ${{ !cancelled() }}
        run: |
          test -s reports/fiscal-cashflow-history-latest.json
          cp reports/fiscal-cashflow-history-latest.json /tmp/complete-fiscal-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/complete-fiscal-result.json reports/fiscal-cashflow-history-latest.json
            git add reports/fiscal-cashflow-history-latest.json
            git commit -m "Record full 2023-present Treasury DTS cashflow accounting and no-lookahead research" || exit 0
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
      - name: Fail closed when full historical identity not reconciled
        run: |
          python3 - <<'PY'
          import json
          j=json.load(open('reports/fiscal-cashflow-history-latest.json'))
          print('status:',j.get('status'),'error:',j.get('error'))
          assert j.get('status')=='dts_cashflows_2024_plus_identity_reconciled_research',j.get('error','Incomplete fiscal identity; no trade signal')
          assert j.get('identity',{}).get('count',0)>690
          assert j.get('excluded_unreconciled_year')==2023
          a=j.get('historical_fiscal_vs_gold_price_candidate_alignment',{})
          assert a.get('status')=='historical_fiscal_predicted_level_direction_vs_gold_price_patterns_only',a.get('error')
          assert a.get('conservative_prior_fiscal_forecasts_found',0)>=30
          assert a.get('trade_signals_enabled') is False
          z=j.get('fiscal_D3_same_target_research_revision_Z',{})
          assert z.get('rolling_z_valid_days',0)>100
          assert z.get('gold_4h_price_crosscheck',{}).get('counts',{}).get('revision_z_record_available',0)>30
          assert z.get('trade_signals_enabled') is False
          ex=j.get('exante_fiscal_predicted_event_prepricing',{}).get('by_threshold',{}).get('30bn',{})
          assert ex.get('status')=='fiscal_predicted_event_prepricing_walk_forward_research_only'
          assert ex.get('by_horizon',{}).get('T-3',{}).get('overall',{}).get('exante_selected_event_days',0)>=10
          assert ex.get('trade_signals_enabled') is False
          PY
