name: Verify V2.2 closed-candle execution safety
on:
  workflow_dispatch:
  push:
    paths:
      - lib/endpoints/v22-execution-core.js
      - tests/v22-execution-core.test.js
      - .github/workflows/v22-execution-validation.yml
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject future-price and missing macro factor execution
        run: |
          node --check lib/endpoints/v22-execution-core.js
          node tests/v22-execution-core.test.js
